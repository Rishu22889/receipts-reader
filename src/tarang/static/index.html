<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt check</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5c6475; --line: #dde1e8;
    --ok: #1f7a4d; --ok-bg: #e6f4ec; --warn: #9a5b00; --warn-bg: #fdf1dd; --bad: #b42318; --bad-bg: #fde8e6; --accent: #2457c5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
            --ok: #5fd39a; --ok-bg: #16322a; --warn: #f0b45a; --warn-bg: #3a2c14; --bad: #ff8a80; --bad-bg: #3d1c1a; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .examples button { width: auto; margin: 0; padding: 5px 9px; font-size: 12px; font-weight: 500; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  #preview { max-width: 100%; max-height: 260px; display: none; margin-top: 10px; border-radius: 6px; border: 1px solid var(--line); }
  .banner { padding: 14px 16px; border-radius: 8px; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .approve { background: var(--ok-bg); color: var(--ok); }
  .review { background: var(--warn-bg); color: var(--warn); }
  .error { background: var(--bad-bg); color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; }
  .t-ok { background: var(--ok-bg); color: var(--ok); } .t-warn { background: var(--warn-bg); color: var(--warn); } .t-bad { background: var(--bad-bg); color: var(--bad); }
  ul.reasons { margin: 0 0 14px; padding-left: 18px; } ul.reasons li { margin: 4px 0; }
  code { font-size: 13px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Receipt check</h1>
  <p id="health">Checking server…</p>
</header>
<main>
  <section>
    <h2>Claim as the rep entered it</h2>
    <div class="muted">Load a real claim from the data:</div>
    <div class="examples" id="examples"></div>
    <form id="form">
      <label for="emp_id">Employee</label><select id="emp_id" name="emp_id" required></select>
      <label for="category">Category</label>
      <select id="category" name="category">
        <option>Food</option><option>Fuel</option><option>Lodging</option><option>Local travel</option><option>Courier</option><option>Parking</option>
      </select>
      <label for="vendor">Vendor</label><input id="vendor" name="vendor">
      <label for="amount_claimed">Amount claimed (Rs)</label><input id="amount_claimed" name="amount_claimed" inputmode="decimal" required>
      <label for="expense_date">Expense date</label><input id="expense_date" name="expense_date" type="date" required>
      <label for="submitted_on">Submitted on</label><input id="submitted_on" name="submitted_on" type="date">
      <label for="claim_id">Claim ID (optional; an existing ID re-checks that claim)</label><input id="claim_id" name="claim_id">
      <label for="photo">Receipt photo (leave empty to see what happens with no photo)</label><input id="photo" name="photo" type="file" accept="image/*">
      <img id="preview" alt="Receipt preview">
      <button id="submit" type="submit">Check claim</button>
    </form>
  </section>
  <section id="result"><h2>Result</h2><p class="muted">Submit a claim to see the fields read from the photo, every check, and the decision.</p></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let REASONS = {};
let examplePhoto = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const statusTag = (s) => {
  const good = ["ok", "verified", "ok_normalised", "inferred_gstin", "inferred_line", "inferred_prefix"];
  const cls = good.some((g) => s.startsWith(g)) ? "t-ok" : (s === "absent" || s === "words_only" ? "t-warn" : "t-bad");
  return `<span class="tag ${cls}">${esc(s)}</span>`;
};

async function init() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("health").textContent = `Reader: ${h.tesseract ? "Tesseract on" : "Tesseract missing"} · VLM mode: ${h.vlm_mode}` +
      (h.cached_vlm_photos ? ` (${h.cached_vlm_photos} photos read on GPU)` : "") + ` · paid API: ${h.paid_api} · rules ${h.rules_version || "?"}` +
      (h.can_read_receipts ? "" : " · NO READER: every claim will go to review");
  } catch (e) { $("health").textContent = "Server not reachable"; }
  REASONS = await (await fetch("/api/reasons")).json();
  const emps = await (await fetch("/api/employees")).json();
  $("emp_id").innerHTML = emps.map((e) => `<option value="${esc(e.emp_id)}">${esc(e.emp_id)} · ${esc(e.name)} (${esc(e.headquarter)}, ${esc(e.grade)})</option>`).join("");
  const ex = await (await fetch("/api/examples")).json();
  $("examples").innerHTML = ex.map((x, i) => `<button type="button" data-i="${i}" title="${esc(x.claim_id)}">${esc(x.label)}</button>`).join("");
  $("examples").querySelectorAll("button").forEach((b) => b.onclick = () => loadExample(ex[+b.dataset.i]));
}

async function loadExample(x) {
  for (const k of ["emp_id", "category", "vendor", "amount_claimed", "expense_date", "submitted_on", "claim_id"]) $(k).value = x[k];
  $("photo").value = ""; examplePhoto = null; $("preview").style.display = "none";
  if (x.has_photo) {
    const blob = await (await fetch(`/api/examples/${encodeURIComponent(x.claim_id)}/photo`)).blob();
    examplePhoto = new File([blob], `${x.claim_id}.jpg`, {type: "image/jpeg"});
    $("preview").src = URL.createObjectURL(blob); $("preview").style.display = "block";
  }
}

$("photo").onchange = () => {
  examplePhoto = null;
  const f = $("photo").files[0];
  if (f) { $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block"; } else { $("preview").style.display = "none"; }
};

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const data = new FormData($("form"));
  data.delete("photo");
  const photo = $("photo").files[0] || examplePhoto;
  if (photo) data.append("photo", photo);
  $("submit").disabled = true; $("submit").textContent = "Reading receipt…";
  try {
    const r = await fetch("/api/claims/check", {method: "POST", body: data});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    render(j);
  } catch (e) {
    $("result").innerHTML = `<h2>Result</h2><div class="banner error">Not checked: ${esc(e.message)}</div><p class="muted">Nothing was approved.</p>`;
  } finally { $("submit").disabled = false; $("submit").textContent = "Check claim"; }
};

function render(j) {
  const reasons = j.reason_codes.map((c) => `<li><code>${esc(c)}</code> ${esc(REASONS[c]?.meaning || "")}</li>`).join("");
  // a check's detail text describes the failure; on a pass, show it only where it reads as evidence (amounts, dates, plates)
  const SAY_ON_PASS = new Set(["under_limit", "amount_read", "amount_matches_claim", "number_format", "date_matches_claim",
                               "vendor_matches_claim", "fuel_vehicle", "memo_name", "lodging_outstation", "lodging_rate", "lodging_name", "rounding"]);
  const checks = j.checks.filter((c) => c.check).sort((a, b) => a.passed - b.passed).map((c) => {
    const detail = c.passed && !SAY_ON_PASS.has(c.check) ? "" : c.detail;
    const code = c.passed ? (REASONS[c.code] && !REASONS[c.code].blocks_approval ? c.code : "") : c.code;
    return `<tr><td>${esc(c.check)}</td><td class="nowrap">${c.passed ? '<span class="tag t-ok">pass</span>' : '<span class="tag t-bad">fail</span>'}</td><td>${esc(code)}</td><td>${esc(detail)}</td></tr>`;
  }).join("");
  const f = j.fields, s = j.field_status;
  const rows = [["Vendor", f.vendor, s.vendor_status], ["Bill date", f.receipt_date, s.date_status], ["Bill number", f.receipt_number, s.number_status],
                ["GSTIN", f.gstin, s.gstin_status], ["Total (Rs)", f.total_amount, s.total_status]]
    .map(([k, v, st]) => `<tr><td>${k}</td><td>${esc(v) || '<span class="muted">blank</span>'}</td><td>${statusTag(st)}</td></tr>`).join("");
  const d = j.details || {};
  const cat = $("category").value;   // show only the details the policy uses for this category
  const extra = [["Vehicle on bill", cat === "Fuel" ? d.vehicle_number : ""], ["Guest name", cat === "Lodging" ? d.guest_name : ""],
                 ["Hotel city", cat === "Lodging" ? d.hotel_city : ""], ["Name on memo", cat === "Local travel" ? d.memo_name : ""],
                 ["Rotation applied", d.rotation ? `${d.rotation}°` : ""], ["Instruction-like text", d.instruction_hits]]
    .filter(([, v]) => v).map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("");
  $("result").innerHTML = `
    <h2>Result · ${esc(j.claim_id)}</h2>
    <div class="banner ${j.decision}">${j.decision === "approve" ? "Approve: pay without a clerk" : "Review: a clerk checks this claim"}</div>
    ${reasons ? `<h2>Why</h2><ul class="reasons">${reasons}</ul>` : `<p>All checks passed.${j.notes.length ? ` Notes: ${esc(j.notes.join(", "))}` : ""}</p>`}
    <h2>Read from the photo</h2>
    <div class="table-wrap"><table><tr><th>Field</th><th>Value</th><th>Status</th></tr>${rows}</table></div>
    ${extra ? `<div class="table-wrap"><table><tr><th>Detail</th><th>Value</th></tr>${extra}</table></div>` : ""}
    <h2>Checks</h2>
    <div class="table-wrap"><table><tr><th>Check</th><th>Result</th><th>Code</th><th>Detail</th></tr>${checks || '<tr><td colspan="4" class="muted">No checks ran: the photo could not be read.</td></tr>'}</table></div>
    <p class="muted">Reader: ${esc(j.reader)} · rules ${esc(j.rules_version)} · ${j.seconds} s</p>
    ${j.warnings.length ? `<p class="muted">Warnings: ${j.warnings.map(esc).join(" · ")}</p>` : ""}`;
}

init();
</script>
</body>
</html>
